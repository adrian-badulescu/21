
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6">
            <div *ngIf="this.httpErrorReceived">
              <p>Error: {{httpError | json}}</p>
            </div>
            <p>Player Balance: {{balance | json}} $</p>            
            <div *ngIf="showResults">   
              <p>You played: {{round | json}} rounds</p>             
                <p>You won: {{winAmount | json}} $</p>
            </div>            
                <div class="col-lg-3"><button class="btn btn-primary" (click)="sitOnTable()">Sit</button></div>
                <div class="col-lg-3"><button class="btn btn-success" (click)="showDealOptions()" [disabled]="toggleDealBtn">Deal</button></div>
            <div class="p-2"></div>           
            <button [disabled]="!roundEnded" class="btn btn-primary" (click)="stand()">Stand</button>
        </div>        
        <div class="col-lg-4 mt-3">
            <button class="btn btn-success" (click)="turn('hit')">&nbsp;Hit&nbsp;</button>
            <div class="col-lg-2"></div>
            <button class="btn btn-danger mt-2" (click)="turn('stay')">Stay</button>
        </div>
    </div>
    <div class="row" *ngIf="showAvailableBettingAmount">
        <table class="table">
            <thead>
              <tr>
                <th scope="col">Available amounts for betting</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let bet of availableBetOptions">                             
                <td><div class="col-lg-2"></div><button class="btn btn-primary" (click)="deal(bet)">Bet {{bet}} $</button></td>
              </tr>
            </tbody>
          </table>
    </div>
    <div class="row" *ngIf="showCards">
        <p>Dealer Cards {{dealerCards | json}}</p>
        <p>Player Cards {{playerCards | json}}</p>
        <p>Round Completed {{roundEnded | json}}</p>
    </div>
</div>
