
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6">
            <p>Player Balance - {{balance | json}} $</p>
            <p>Player Round - {{round | json}}</p>
            <div *ngIf="roundEnded">                
                <p>Win Amount - {{dealResponse.winAmount | json}} $</p>
            </div>
            <button class="btn btn-primary" (click)="sitOnTable()">Sit</button> 
            <div class="p-2"></div>           
            <button [disabled]="!dealResponse.roundEnded" class="btn btn-primary">Stand</button>
        </div>        
        <div class="col-lg-4 mt-3">
            <button class="btn btn-success" (click)="turn('hit')">&nbsp;Hit&nbsp;</button>
            <div class="col-lg-2"></div>
            <button class="btn btn-danger mt-2" (click)="turn('stay')">Stay</button>
        </div>
    </div>
    <div class="row">
        <table class="table">
            <thead>
              <tr>
                <th scope="col">Available amounts for betting</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let bet of availableBetOptions">                             
                <td><div class="col-lg-2"></div><button class="btn btn-primary" (click)="deal(bet)">Bet {{bet}} $</button></td>
              </tr>
            </tbody>
          </table>
    </div>
    <div class="row">
        <h3>Dealer Cards {{dealerCards | json}}</h3>
        <h3>Player Cards {{playerCards | json}}</h3>
        <h3>Round Completed {{roundEnded | json}}</h3>
    </div>
</div>
