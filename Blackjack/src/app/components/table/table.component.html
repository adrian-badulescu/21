
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-6">
            <p>Player Balance - {{balance | json}}</p>
            <div *ngIf="dealResponse.roundEnded">
                <p>Player Round - {{round | json}}</p>
                <p>Win Amount - {{dealResponse.winAmount | json}}</p>
            </div>
            <button class="btn btn-primary" (click)="sitOnTable()">Sit</button>
        </div>        
        <div class="col-lg-4 mt-3">
            <button class="btn btn-success">&nbsp;Hit&nbsp;</button>
            <div class="col-lg-2"></div>
            <button class="btn btn-danger mt-2">Stay</button>
        </div>
    </div>
    <div class="row">
        <table class="table">
            <thead>
              <tr>
                <th scope="col">Available amounts for betting</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let bet of availableBetOptions">                             
                <td><div class="col-lg-2"></div><button class="btn btn-primary" (click)="deal(bet)">Bet {{bet}}</button></td>
              </tr>
            </tbody>
          </table>
    </div>
    <div class="row">
        <h3>Dealer Cards {{dealResponse.dealerCards | json}}</h3>
        <h3>Player Cards {{dealResponse.playerCards | json}}</h3>
        <h3>Round Completed {{dealResponse.roundEnded | json}}</h3>
    </div>
</div>
